plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.diffplug.spotless' version '8.9.0'
}

group = 'com.nearvanilla'
version = '1.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "scarsz-nexus"
        url = "https://nexus.scarsz.me/content/groups/public/"
    }
}

def paperApi = "io.papermc.paper:paper-api:26.3.build.200-stable"
def mockito = "org.mockito:mockito-core:5.24.0"

configurations {
    mockitoAgent
}

dependencies {
    compileOnly(paperApi)
    implementation("org.incendo:cloud-paper:2.0.1")
    implementation("org.incendo:cloud-annotations:2.1.0")
    implementation("tools.jackson.core:jackson-core:3.2.1")
    implementation("tools.jackson.core:jackson-databind:3.2.1")
    compileOnly("xyz.jpenilla:squaremap-api:1.4.3")
    compileOnly("com.discordsrv:discordsrv:1.30.5")
    compileOnly("de.hexaoxi:carbonchat-api:3.0.0-beta.37")
    testImplementation(platform("org.junit:junit-bom:6.1.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.xerial:sqlite-jdbc:3.49.1.0")
    testImplementation(paperApi)
    testImplementation(mockito)
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.119.0")
    mockitoAgent(mockito) {
        transitive = false
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// Runs git and returns its output, or null when git is missing or the command fails, so a build
// outside a git checkout still succeeds.
def gitOutput = { String... args ->
    try {
        def execution = providers.exec {
            commandLine(['git'] + args.toList())
            ignoreExitValue = true
        }
        return execution.result.get().exitValue == 0 ? execution.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}

// Picks the first value that is set, falling back to "unknown". Closures are only called when
// reached, so git is not run for a value that has an override.
def firstKnown = { Object... candidates ->
    for (candidate in candidates) {
        def value = candidate instanceof Closure ? candidate() : candidate
        if (value != null && !value.toString().isBlank()) {
            return value.toString()
        }
    }
    return 'unknown'
}

def env = { String name -> providers.environmentVariable(name).orNull }

// Supplies the build time when the task runs, so a reused configuration cache cannot freeze it.
abstract class BuildTimeSource implements org.gradle.api.provider.ValueSource<String, org.gradle.api.provider.ValueSourceParameters.None> {
    @Override
    String obtain() {
        return java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()
    }
}

// Describes the build inside the JAR, read at runtime by the info module.
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')
def generateBuildInfo = tasks.register('generateBuildInfo', WriteProperties) {
    destinationFile = buildInfoDir.map { it.file('build-info.properties') }
    property('version', providers.provider { project.version.toString() })
    property('build.number', providers.provider {
        firstKnown(findProperty('buildNumber'), env('GITHUB_RUN_NUMBER'), 'local')
    })
    property('build.time', providers.of(BuildTimeSource) {})
    // Git comes before GITHUB_SHA so the id always matches the subject and time, which only git
    // can supply.
    property('git.commit.id', providers.provider {
        firstKnown(findProperty('gitCommitId'), { gitOutput('rev-parse', 'HEAD') }, env('GITHUB_SHA'))
    })
    property('git.commit.subject', providers.provider {
        firstKnown(findProperty('gitCommitSubject'), { gitOutput('log', '-1', '--format=%s') })
    })
    property('git.commit.time', providers.provider {
        firstKnown(findProperty('gitCommitTime'), { gitOutput('log', '-1', '--format=%cI') })
    })
    property('git.branch', providers.provider {
        // symbolic-ref fails on a detached HEAD, which leaves the branch unknown instead of "HEAD".
        firstKnown(findProperty('gitBranch'), env('GITHUB_HEAD_REF'), env('GITHUB_REF_NAME'),
                { gitOutput('symbolic-ref', '--short', '-q', 'HEAD') })
    })
    property('git.dirty', providers.provider {
        def status = gitOutput('status', '--porcelain')
        status == null ? 'unknown' : (!status.isEmpty()).toString()
    })
}

// Part of the main output, so the JARs and the tests all see the same generated file.
sourceSets.main.output.dir(buildInfoDir, builtBy: generateBuildInfo)

// The build time changes on every build. Ignoring it here stops that from rerunning the tests.
normalization {
    runtimeClasspath {
        properties('**/build-info.properties') {
            ignoreProperty('build.time')
        }
    }
}

runServer {
    minecraftVersion("26.3")
    jvmArgs("-Dcom.mojang.eula.agree=true")
    downloadPlugins {
        url("https://cdn.modrinth.com/data/PFb7ZqK6/versions/6wmZVQBO/squaremap-paper-mc26.3-1.4.3.jar")
        url("https://cdn.modrinth.com/data/UmLGoGij/versions/ATlquwiT/DiscordSRV-Build-1.30.5.jar")
        url("https://cdn.modrinth.com/data/QzooIsZI/versions/GM05Fv8t/carbonchat-paper-3.0.0-beta.39.jar")
        url("https://cdn.modrinth.com/data/Vebnzrzj/versions/b0mk8uS6/LuckPerms-Bukkit-5.5.71.jar")
        url("https://cdn.modrinth.com/data/oIBGjZ77/versions/rIPMStjV/ArmorStandEditor-26.3-52.1.jar")
    }
}

test {
    useJUnitPlatform()
    // Resolve the agent path lazily, only when tests actually run.
    jvmArgumentProviders.add({ ["-javaagent:${configurations.mockitoAgent.asPath}".toString()] } as CommandLineArgumentProvider)
}

shadowJar {
    enableAutoRelocation = true
    relocationPrefix = "${rootProject.property("group")}.${rootProject.property("name").toString().toLowerCase()}.lib"
    minimize()
    archiveClassifier.set("")
    // Exclude duplicate meta files to fix remap errors
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/NOTICE'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

spotless{
    java{
        importOrder()
        removeUnusedImports()
        forbidWildcardImports()
        cleanthat()
        googleJavaFormat()
    }
}